name: 참조 이미지 기반 장면 재생성

on:
  push:
    paths:
      - "scripts/build_character_sheets.py"
      - "scripts/regen_scene_ref.py"
      - ".github/workflows/regen-scenes-ref.yml"
  workflow_dispatch:
    inputs:
      skit:
        description: 스킷 이름
        required: false
        default: "참교육사이다"
      map_file:
        description: 장면번호->인물목록 JSON 매핑 파일 경로
        required: false
        default: "scripts/scenes/참교육사이다-regen-map.json"
      characters_only:
        description: 캐릭터 시트를 새로 만들 인물만 지정 (쉼표, 비우면 전체 — 이미 있으면 재사용)
        required: false
        default: ""
      skip_map_regen:
        description: 장면 매핑 재생성 단계를 건너뛸지 (true/false — 아웃트로 등 단독 컷만 만들 때)
        required: false
        default: "false"
      custom_image:
        description: (선택) 카메오 등 단독 컷용 참조 이미지 경로
        required: false
        default: ""
      custom_prompt:
        description: custom_image와 함께 쓰는 장면 프롬프트
        required: false
        default: ""
      custom_duration:
        description: custom_image 컷 길이(초, 4~15)
        required: false
        default: "8"
      custom_out_name:
        description: custom_image 결과 파일 이름 (out/ 아래)
        required: false
        default: "outro.mp4"

env:
  SKIT: ${{ inputs.skit || '참교육사이다' }}
  MAP_FILE: ${{ inputs.map_file || 'scripts/scenes/참교육사이다-regen-map.json' }}
  CHARACTERS_ONLY: ${{ inputs.characters_only }}
  SKIP_MAP_REGEN: ${{ inputs.skip_map_regen }}
  CUSTOM_IMAGE: ${{ inputs.custom_image }}
  CUSTOM_PROMPT: ${{ inputs.custom_prompt }}
  CUSTOM_DURATION: ${{ inputs.custom_duration || '8' }}
  CUSTOM_OUT_NAME: ${{ inputs.custom_out_name || 'outro.mp4' }}

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: fal-client 설치
        run: pip install --quiet fal-client

      - name: 캐릭터 시트 생성
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_API_KEY }}
        run: python3 scripts/build_character_sheets.py --only "${CHARACTERS_ONLY}"

      - name: 캐릭터 시트 커밋 (재사용 자산)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/characters
          git diff --cached --quiet || git commit -m "캐릭터 시트 생성/갱신 (${SKIT})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: 지정 장면 참조 재생성
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_map_regen != 'true' }}
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_API_KEY }}
        run: |
          python3 scripts/regen_scene_ref.py \
            --scenes-json "scripts/scenes/${SKIT}.json" \
            --map "${MAP_FILE}" \
            --out-dir out

      - name: 단독 컷 생성 (아웃트로 등 custom_image 지정 시)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.custom_image != '' }}
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_API_KEY }}
        run: |
          python3 scripts/regen_scene_ref.py \
            --custom-image "${CUSTOM_IMAGE}" \
            --custom-prompt "${CUSTOM_PROMPT}" \
            --custom-duration "${CUSTOM_DURATION}" \
            --custom-out "out/${CUSTOM_OUT_NAME}"

      - name: 결과 Artifact 업로드 (장면 재생성분)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.skip_map_regen != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: out/scene*.mp4
          retention-days: 30

      - name: 결과 Artifact 업로드 (단독 컷)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.custom_image != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKIT }}-custom-clip
          path: out/${{ env.CUSTOM_OUT_NAME }}
          retention-days: 30

      - name: 단독 컷 브랜치에 커밋
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.custom_image != '' }}
        run: |
          if [ ! -f "out/${CUSTOM_OUT_NAME}" ]; then
            echo "out/${CUSTOM_OUT_NAME} 없음 — 생성 단계 실패, 커밋 생략"
            exit 0
          fi
          mkdir -p "video-tests/${SKIT}/custom"
          cp "out/${CUSTOM_OUT_NAME}" "video-tests/${SKIT}/custom/"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "video-tests/${SKIT}/custom"
          git commit -m "단독 컷 추가 (${SKIT}, ${CUSTOM_OUT_NAME})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
