name: 인물 초상 생성

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 초상 스펙 이름 (scripts/portraits/<spec>.json)
        required: false
        default: "mom-memory-delivery"
      regen_ids:
        description: 다시 만들 인물 id 목록 (공백 구분, 예 "guard minho")
        required: false
        default: ""
      resume_run_id:
        description: 이 run의 Artifact에서 이미 생성된 초상을 복원해 이어하기 (선택)
        required: false
        default: ""

env:
  SPEC: ${{ inputs.spec || 'mom-memory-delivery' }}

jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 이전 실행 초상 복원 (이어하기)
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SPEC }}-portraits
          path: out/portraits
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - name: 커밋된 초상 복원 (이미 확정된 초상 재사용)
        run: |
          if [ -d "assets/portraits/${SPEC}" ]; then
            mkdir -p out/portraits
            cp -nv "assets/portraits/${SPEC}"/*.png out/portraits/ || true
          fi

      - name: 다시 만들 인물 삭제 (부분 재생성)
        if: ${{ inputs.regen_ids != '' }}
        run: |
          for id in ${{ inputs.regen_ids }}; do
            rm -fv out/portraits/"$id"-*.png
          done

      - name: 초상 생성 (fal.ai)
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: python3 scripts/generate_portraits.py "${SPEC}"

      - name: 초상 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SPEC }}-portraits
          path: out/portraits/*.png
          retention-days: 7

      - name: 초상을 저장소에 커밋
        run: |
          mkdir -p "assets/portraits/${SPEC}"
          cp -v out/portraits/*.png "assets/portraits/${SPEC}/"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "assets/portraits/${SPEC}"
          git diff --cached --quiet || git commit -m "인물 초상 후보 추가 (${SPEC})"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
