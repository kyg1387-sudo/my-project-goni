name: 콩트 영상 생성

on:
  workflow_dispatch:
    inputs:
      skit:
        description: 생성할 스킷 이름 (scripts/scenes/<skit>.json)
        required: false
        default: "bungeoppang"
      scenes_only:
        description: 재생성할 장면 번호만 지정 (예 "3,5,7", 비우면 전체)
        required: false
        default: ""

env:
  SKIT: ${{ inputs.skit || 'bungeoppang' }}
  SCENES_ONLY: ${{ inputs.scenes_only }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 장면별 클립 생성 (Ark Seedance / fal.ai)
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: python3 scripts/generate_video.py "scripts/scenes/${SKIT}.json"

      - name: ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 클립 이어붙이기
        # concat 목록 안의 상대 경로는 목록 파일 위치 기준으로 해석되므로 out/ 안에서 실행
        working-directory: out
        run: |
          ls scene*.mp4 | sed "s/^/file '/;s/$/'/" > list.txt
          ffmpeg -f concat -safe 0 -i list.txt -c copy "${SKIT}-skit.mp4"

      - name: 결과 영상 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: |
            out/scene*.mp4
            out/${{ env.SKIT }}-skit.mp4
          retention-days: 30

      # Artifact 저장소(Azure)에 접근할 수 없는 환경에서도 git으로 시험 클립을 받을 수
      # 있게 한다 — scenes_only(부분 시험 생성)일 때만. 전체 생성은 용량 문제로 제외.
      - name: 시험 클립 브랜치에 커밋 (scenes_only 지정 시)
        if: ${{ inputs.scenes_only != '' }}
        run: |
          mkdir -p "video-tests/${SKIT}"
          cp out/scene*.mp4 "video-tests/${SKIT}/"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "video-tests/${SKIT}"
          git commit -m "시험 장면 클립 추가 (${SKIT}, scenes ${SCENES_ONLY})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
