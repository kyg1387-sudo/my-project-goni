name: 콩트 영상 생성

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 장면별 클립 생성 (Ark Seedance)
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: python3 scripts/generate_video.py

      - name: 클립 이어붙이기
        run: |
          ls out/scene*.mp4 | sed "s/^/file '/;s/$/'/" > out/list.txt
          ffmpeg -f concat -safe 0 -i out/list.txt -c copy out/bungeoppang-skit.mp4

      - name: 결과 영상 업로드
        uses: actions/upload-artifact@v4
        with:
          name: bungeoppang-skit-video
          path: |
            out/scene*.mp4
            out/bungeoppang-skit.mp4
          retention-days: 7
