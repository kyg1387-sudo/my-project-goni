name: 콩트 영상 생성

on:
  workflow_dispatch:
    inputs:
      skit:
        description: 생성할 스킷 이름 (scripts/scenes/<skit>.json)
        required: false
        default: "bungeoppang"
      resume_run_id:
        description: 이 run의 Artifact에서 이미 생성된 장면 클립을 복원해 이어하기 (선택)
        required: false
        default: ""

env:
  SKIT: ${{ inputs.skit || 'bungeoppang' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: 이전 실행 장면 클립 복원 (이어하기)
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: out
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - name: 장면별 클립 생성 (Ark Seedance / fal.ai)
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: python3 scripts/generate_video.py "scripts/scenes/${SKIT}.json"

      - name: ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 클립 이어붙이기
        # concat 목록 안의 상대 경로는 목록 파일 위치 기준으로 해석되므로 out/ 안에서 실행
        working-directory: out
        run: |
          ls scene*.mp4 | sed "s/^/file '/;s/$/'/" > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy "${SKIT}-skit.mp4"

      - name: 결과 영상 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: |
            out/scene*.mp4
            out/${{ env.SKIT }}-skit.mp4
          retention-days: 7
