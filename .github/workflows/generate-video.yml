name: 콩트 영상 생성

on:
  workflow_dispatch:
    inputs:
      skit:
        description: 생성할 스킷 이름 (scripts/scenes/<skit>.json)
        required: false
        default: "bungeoppang"
      resume_run_id:
        description: 이 run의 Artifact에서 이미 생성된 장면 클립을 복원해 이어하기 (선택)
        required: false
        default: ""
      regen_scenes:
        description: 복원 후 다시 만들 장면 번호 목록 (공백 구분, 예 "9 59 81")
        required: false
        default: ""
      portraits_spec:
        description: 인물 초상 생성 모드 — 스펙 이름 (scripts/portraits/<spec>.json). 지정 시 영상 생성 대신 초상만 생성
        required: false
        default: ""
      portraits_regen_ids:
        description: (초상 모드) 다시 만들 인물 id 목록 (공백 구분, 예 "guard minho")
        required: false
        default: ""

env:
  SKIT: ${{ inputs.skit || 'bungeoppang' }}
  SPEC: ${{ inputs.portraits_spec }}

jobs:
  portraits:
    if: ${{ inputs.portraits_spec != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 커밋된 초상 복원 (이미 확정된 초상 재사용)
        run: |
          if [ -d "assets/portraits/${SPEC}" ]; then
            mkdir -p out/portraits
            cp -nv "assets/portraits/${SPEC}"/*.png out/portraits/ || true
          fi

      - name: 다시 만들 인물 삭제 (부분 재생성)
        if: ${{ inputs.portraits_regen_ids != '' }}
        run: |
          for id in ${{ inputs.portraits_regen_ids }}; do
            rm -fv out/portraits/"$id"-*.png
          done

      - name: 초상 생성 (fal.ai)
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: python3 scripts/generate_portraits.py "${SPEC}"

      - name: 초상 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SPEC }}-portraits
          path: out/portraits/*.png
          retention-days: 7

      - name: 초상을 저장소에 커밋
        run: |
          mkdir -p "assets/portraits/${SPEC}"
          cp -v out/portraits/*.png "assets/portraits/${SPEC}/"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "assets/portraits/${SPEC}"
          git diff --cached --quiet || git commit -m "인물 초상 후보 추가 (${SPEC})"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

  generate:
    if: ${{ inputs.portraits_spec == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: 이전 실행 장면 클립 복원 (이어하기)
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: out
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - name: 다시 만들 장면 삭제 (부분 재생성)
        if: ${{ inputs.regen_scenes != '' }}
        run: |
          for n in ${{ inputs.regen_scenes }}; do
            rm -fv "out/$(printf 'scene%02d' "$n").mp4"
          done

      - name: 장면별 클립 생성 (Ark Seedance / fal.ai)
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: python3 scripts/generate_video.py "scripts/scenes/${SKIT}.json"

      - name: ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 클립 이어붙이기 (규격 정규화 + 계획 길이 트리밍)
        # 클립별 인코딩 차이로 인한 화면 깨짐과, 클립이 계획보다 길 때 생기는
        # 자막·음성 누적 오차를 막는다: 1280x720/24fps 통일, 화면비 유지 + 패딩,
        # 장면 파일의 계획 길이(duration)로 정확히 자름
        run: python3 scripts/concat_scenes.py "scripts/scenes/${SKIT}.json" out "out/${SKIT}-skit.mp4"

      - name: 결과 영상 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: |
            out/scene*.mp4
            out/${{ env.SKIT }}-skit.mp4
          retention-days: 7
