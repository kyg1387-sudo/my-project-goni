name: 콩트 영상 생성

on:
  workflow_dispatch:
    inputs:
      skit:
        description: 생성할 스킷 이름 (scripts/scenes/<skit>.json)
        required: false
        default: "bungeoppang"
      resume_run_id:
        description: 이 run의 Artifact에서 이미 생성된 장면 클립을 복원해 이어하기 (선택)
        required: false
        default: ""

env:
  SKIT: ${{ inputs.skit || 'bungeoppang' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: 이전 실행 장면 클립 복원 (이어하기)
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: out
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - name: 장면별 클립 생성 (Ark Seedance / fal.ai)
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: python3 scripts/generate_video.py "scripts/scenes/${SKIT}.json"

      - name: ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 클립 이어붙이기 (규격 정규화)
        # 클립별 인코딩 차이로 인한 화면 깨짐을 막기 위해 전 클립을 동일 규격으로
        # 재인코딩해 이어붙인다: 1280x720, 화면비 유지 + 패딩(찌그러짐 방지), 24fps
        working-directory: out
        run: |
          FILTER=""; INPUTS=""; N=0
          for f in $(ls scene*.mp4); do
            INPUTS="$INPUTS -i $f"
            FILTER="$FILTER[$N:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=24,setsar=1[v$N];"
            N=$((N+1))
          done
          CHAIN=$(seq 0 $((N-1)) | sed 's/.*/[v&]/' | tr -d '\n')
          ffmpeg -y $INPUTS -filter_complex "${FILTER}${CHAIN}concat=n=${N}:v=1:a=0[vc]" \
            -map "[vc]" -an -c:v libx264 -preset medium -crf 18 "${SKIT}-skit.mp4"

      - name: 결과 영상 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: |
            out/scene*.mp4
            out/${{ env.SKIT }}-skit.mp4
          retention-days: 7
