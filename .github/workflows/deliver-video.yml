name: 영상 저장소로 가져오기

# Actions Artifact는 외부 네트워크가 막힌 환경에서 받을 수 없으므로,
# 완성된 영상 파일을 브랜치의 deliveries/ 폴더에 커밋해 git으로 받을 수 있게 한다.
on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 가져올 Artifact 이름
        required: true
      source_run_id:
        description: Artifact가 있는 워크플로 실행의 run ID
        required: true
      file:
        description: Artifact 안에서 커밋할 파일 이름
        required: true

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Artifact 내려받기
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: 영상 파일 커밋
        run: |
          mkdir -p deliveries
          cp "artifact/${{ inputs.file }}" deliveries/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deliveries
          git commit -m "완성 영상 추가: ${{ inputs.file }}"
          git push
