name: 콩트 영상 자막 입히기

on:
  workflow_dispatch:
    inputs:
      skit:
        description: 자막을 입힐 스킷 이름 (subs/<skit>.ass)
        required: false
        default: "bungeoppang"
      source_run_id:
        description: 클립 Artifact를 가져올 영상 생성 실행의 run ID
        required: false
        default: "34182640358"
      commit_output:
        description: 완성 영상을 브랜치 deliveries/ 폴더에 커밋할지 여부 (true/false)
        required: false
        default: "false"
      add_audio:
        description: 대사 TTS와 배경음악을 생성해 입힐지 여부 (true/false)
        required: false
        default: "false"
      lipsync:
        description: 대사 구간 입 모양 재합성과 장면 현장음 생성 여부 (true/false)
        required: false
        default: "false"
      deliver_from_run_id:
        description: 제작을 건너뛰고 이 run의 완성 Artifact에서 영상만 꺼내 커밋 (선택)
        required: false
        default: ""
      resume_run_id:
        description: 이 run의 Artifact에서 중간 산출물(out/audio)을 복원해 이어하기 (선택)
        required: false
        default: ""
      invalidate:
        description: 복원 후 다시 만들 산출물 패턴 (out/audio 기준, 공백 구분, 예 "lip*.mp4 amb09.wav")
        required: false
        default: ""
      remap_removed:
        description: 자막에서 삭제된 TTS 줄의 옛 번호 목록 — 캐시 번호를 당겨 재사용 (공백 구분, 예 "3 58")
        required: false
        default: ""
      qa_language_only:
        description: 제작 대신 오디오 캐시 언어 검사만 실행 (resume_run_id의 Artifact 대상, 무료)
        required: false
        default: "false"

env:
  SKIT: ${{ inputs.skit || 'bungeoppang' }}
  # push 트리거로 실행될 때 사용할 기본 소스 실행 (붕어빵 4차 영상 생성 성공 실행)
  SOURCE_RUN_ID: ${{ inputs.source_run_id || '34182640358' }}

jobs:
  # 새 워크플로 파일은 main에 있어야 dispatch가 돼서, 언어 QA를 잡으로 내장한다
  qa-language:
    if: ${{ inputs.qa_language_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 오디오 캐시 내려받기
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video-subbed
          path: out
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - name: TTS 캐시 줄 번호 재매핑 (자막 줄 삭제 반영)
        if: ${{ inputs.remap_removed != '' }}
        run: python3 scripts/remap_tts_cache.py out/audio ${{ inputs.remap_removed }}

      - name: ffmpeg와 faster-whisper 설치
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --quiet faster-whisper

      - name: 대사 파일 길이 출력 (대화 리듬 계산용)
        run: |
          for f in out/audio/line*.mp3; do
            d=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f")
            echo "DUR $(basename "$f") $d"
          done

      - name: 언어 검사 실행
        run: python3 scripts/qa_language.py --audio-dir out/audio --ass "subs/${SKIT}.ass"

      - name: 보고서 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKIT }}-qa-language-report
          path: out/audio/qa_language_report.txt
          retention-days: 7

  burn:
    if: ${{ inputs.qa_language_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 완성 Artifact에서 영상만 내려받기 (전달 전용 모드)
        if: ${{ inputs.deliver_from_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video-subbed
          path: out
          run-id: ${{ inputs.deliver_from_run_id }}
          github-token: ${{ github.token }}

      - name: 생성된 클립 내려받기
        if: ${{ inputs.deliver_from_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: out
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: ffmpeg와 한글 폰트 설치
        if: ${{ inputs.deliver_from_run_id == '' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 자막 입히기
        if: ${{ inputs.deliver_from_run_id == '' }}
        run: |
          ffmpeg -i "out/${SKIT}-skit.mp4" -vf "ass=subs/${SKIT}.ass" \
            -c:v libx264 -preset medium -crf 18 -c:a copy \
            "out/${SKIT}-skit-subbed.mp4"

      - name: 이전 실행 중간 산출물 복원 (이어하기)
        if: ${{ inputs.resume_run_id != '' && inputs.deliver_from_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video-subbed
          path: out
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - name: TTS 캐시 줄 번호 재매핑 (자막 줄 삭제 반영)
        if: ${{ inputs.remap_removed != '' && inputs.deliver_from_run_id == '' }}
        run: python3 scripts/remap_tts_cache.py out/audio ${{ inputs.remap_removed }}

      - name: 복원 산출물 중 다시 만들 것 삭제 (부분 재생성)
        if: ${{ inputs.invalidate != '' && inputs.deliver_from_run_id == '' }}
        run: |
          cd out/audio 2>/dev/null || exit 0
          for p in ${{ inputs.invalidate }}; do
            rm -fv $p
          done

      - name: TTS 교체본 덮어쓰기 (assets/audio-overrides — 상위 TTS로 바꾼 줄)
        if: ${{ inputs.deliver_from_run_id == '' }}
        run: |
          if [ -d "assets/audio-overrides/${SKIT}" ]; then
            mkdir -p out/audio
            cp -v "assets/audio-overrides/${SKIT}"/*.mp3 out/audio/
          fi

      - name: 대사 TTS와 배경음악 생성 후 믹싱 (립싱크·현장음 옵션)
        if: ${{ inputs.add_audio == 'true' && inputs.deliver_from_run_id == '' }}
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ inputs.lipsync }}" = "true" ]; then
            pip install --quiet fal-client
            EXTRA="--lipsync --scenes-dir out"
          fi
          python3 scripts/generate_audio.py \
            --ass "subs/${SKIT}.ass" \
            --config "scripts/audio/${SKIT}.json" \
            --video "out/${SKIT}-skit-subbed.mp4" \
            --out "out/${SKIT}-skit-final.mp4" \
            $EXTRA

      - name: 결과 영상 업로드
        if: ${{ always() && inputs.deliver_from_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video-subbed
          path: |
            out/${{ env.SKIT }}-skit-subbed.mp4
            out/${{ env.SKIT }}-skit-final.mp4
            out/audio/line*.mp3
            out/audio/lip*.mp4
            out/audio/amb*.wav
            out/audio/ambg-*.media
            out/audio/bgm.audio
          retention-days: 7

      # Artifact 저장소(Azure)에 접근할 수 없는 환경에서 git으로 영상을 받을 수 있게 한다
      - name: 완성 영상 브랜치에 커밋
        if: ${{ inputs.commit_output == 'true' }}
        run: |
          mkdir -p deliveries
          if [ -f "out/${SKIT}-skit-final.mp4" ]; then
            SRC="out/${SKIT}-skit-final.mp4"
          else
            SRC="out/${SKIT}-skit-subbed.mp4"
          fi
          BASE="deliveries/$(basename "$SRC")"
          rm -f "$BASE" "$BASE".part-*
          # GitHub 파일 한도(100MB) 초과 시 90MB 조각으로 분할 (cat *.part-* > 원본 으로 복원)
          if [ "$(stat -c%s "$SRC")" -gt 99000000 ]; then
            split -b 90m -d "$SRC" "$BASE.part-"
          else
            cp "$SRC" deliveries/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deliveries
          git commit -m "완성 영상 추가 (${SKIT})"
          # 실행 중 브랜치에 다른 커밋이 올라온 경우에 대비
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
