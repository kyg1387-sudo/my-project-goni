name: 콩트 영상 자막 입히기

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 클립 Artifact를 가져올 영상 생성 실행의 run ID
        required: true
      subs_file:
        description: 입힐 자막 파일 경로
        required: false
        default: subs/bungeoppang-seq003.ass

jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 생성된 클립 내려받기
        uses: actions/download-artifact@v4
        with:
          name: bungeoppang-skit-video
          path: out
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: ffmpeg와 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 자막 입히기
        run: |
          ffmpeg -i out/bungeoppang-skit.mp4 -vf "ass=${{ inputs.subs_file }}" \
            -c:v libx264 -preset medium -crf 18 -c:a copy \
            out/bungeoppang-skit-subbed.mp4

      - name: 대사 음성과 배경 소리 입히기
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
        run: |
          python3 scripts/generate_audio.py \
            out/bungeoppang-skit-subbed.mp4 out/bungeoppang-skit-final.mp4

      - name: 결과 영상 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bungeoppang-skit-video-subbed
          path: |
            out/bungeoppang-skit-subbed.mp4
            out/bungeoppang-skit-final.mp4
          retention-days: 7
