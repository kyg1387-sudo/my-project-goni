name: 콩트 영상 자막 입히기

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 클립 Artifact를 가져올 영상 생성 실행의 run ID
        required: false
        default: "34182640358"
  push:
    branches:
      - claude/bungeoppang-pricing-skit-qdmcje
    paths:
      - .github/workflows/burn-subtitles.yml
      - subs/**

env:
  # push 트리거로 실행될 때 사용할 기본 소스 실행 (4차 영상 생성 성공 실행)
  DEFAULT_SOURCE_RUN_ID: "34182640358"

jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 생성된 클립 내려받기
        uses: actions/download-artifact@v4
        with:
          name: bungeoppang-skit-video
          path: out
          run-id: ${{ inputs.source_run_id || env.DEFAULT_SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: ffmpeg와 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 자막 입히기
        run: |
          ffmpeg -i out/bungeoppang-skit.mp4 -vf "ass=subs/bungeoppang.ass" \
            -c:v libx264 -preset medium -crf 18 -c:a copy \
            out/bungeoppang-skit-subbed.mp4

      - name: 결과 영상 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bungeoppang-skit-video-subbed
          path: out/bungeoppang-skit-subbed.mp4
          retention-days: 7
