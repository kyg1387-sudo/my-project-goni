name: 콩트 영상 자막 입히기

on:
  workflow_dispatch:
    inputs:
      skit:
        description: 자막을 입힐 스킷 이름 (subs/<skit>.ass)
        required: false
        default: "bungeoppang"
      source_run_id:
        description: 클립 Artifact를 가져올 영상 생성 실행의 run ID
        required: false
        default: "34182640358"

env:
  SKIT: ${{ inputs.skit || 'bungeoppang' }}
  # push 트리거로 실행될 때 사용할 기본 소스 실행 (붕어빵 4차 영상 생성 성공 실행)
  SOURCE_RUN_ID: ${{ inputs.source_run_id || '34182640358' }}

jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 생성된 클립 내려받기
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: out
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: ffmpeg와 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 자막 입히기
        run: |
          ffmpeg -i "out/${SKIT}-skit.mp4" -vf "ass=subs/${SKIT}.ass" \
            -c:v libx264 -preset medium -crf 18 -c:a copy \
            "out/${SKIT}-skit-subbed.mp4"

      - name: 결과 영상 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video-subbed
          path: out/${{ env.SKIT }}-skit-subbed.mp4
          retention-days: 7
