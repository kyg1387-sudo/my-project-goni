name: 콩트 영상 자막 입히기

on:
  workflow_dispatch:
    inputs:
      skit:
        description: 자막을 입힐 스킷 이름 (subs/<skit>.ass)
        required: false
        default: "bungeoppang"
      source_run_id:
        description: 클립 Artifact를 가져올 영상 생성 실행의 run ID
        required: false
        default: "34182640358"
      commit_output:
        description: 완성 영상을 브랜치 deliveries/ 폴더에 커밋할지 여부 (true/false)
        required: false
        default: "false"
      add_audio:
        description: 대사 TTS와 배경음악을 생성해 입힐지 여부 (true/false)
        required: false
        default: "false"
      lipsync:
        description: 대사 구간 입 모양 재합성과 장면 현장음 생성 여부 (true/false)
        required: false
        default: "false"
      deliver_from_run_id:
        description: 제작을 건너뛰고 이 run의 완성 Artifact에서 영상만 꺼내 커밋 (선택)
        required: false
        default: ""
      resume_run_id:
        description: 이 run의 Artifact에서 중간 산출물(out/audio)을 복원해 이어하기 (선택)
        required: false
        default: ""
      replace_run_id:
        description: 이 run에서 재생성한 장면 클립으로 원본 장면을 교체 (선택)
        required: false
        default: ""
      replace_run_id2:
        description: 추가 교체 run (replace_run_id 적용 후 덮어씀, 선택)
        required: false
        default: ""
      replace_run_id3:
        description: 추가 교체 run 3 (마지막에 덮어씀, 선택)
        required: false
        default: ""
      invalidate:
        description: 복원한 중간 산출물 중 다시 만들 파일 (out/audio 기준 글롭, 공백 구분)
        required: false
        default: ""
      qc_tts:
        description: 대사 TTS 언어 검사만 수행 (true/false)
        required: false
        default: "false"
      qc_patterns:
        description: QC 대상 파일 패턴 (비우면 line*.mp3, 예 "amb*.wav,bgm.audio")
        required: false
        default: ""
      slice_source:
        description: 소스 Artifact 만료 시, deliveries의 완성본을 잘라 장면 복구 (true/false)
        required: false
        default: ""
      burn_scenes:
        description: slice_source 모드에서 자막이 없는(교체된) 장면 번호 목록 (예 "3,5,7")
        required: false
        default: ""

env:
  SKIT: ${{ inputs.skit || 'bungeoppang' }}
  # push 트리거로 실행될 때 사용할 기본 소스 실행 (붕어빵 4차 영상 생성 성공 실행)
  SOURCE_RUN_ID: ${{ inputs.source_run_id || '34182640358' }}

jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 완성 Artifact에서 영상만 내려받기 (전달 전용 모드)
        if: ${{ inputs.deliver_from_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video-subbed
          path: out
          run-id: ${{ inputs.deliver_from_run_id }}
          github-token: ${{ github.token }}

      - name: 생성된 클립 내려받기
        if: ${{ inputs.deliver_from_run_id == '' && inputs.qc_tts != 'true' && inputs.slice_source == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: out
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: 재생성 장면 클립으로 교체
        if: ${{ inputs.replace_run_id != '' && inputs.deliver_from_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: out/replace
          run-id: ${{ inputs.replace_run_id }}
          github-token: ${{ github.token }}

      - name: 추가 교체 장면 클립 내려받기
        if: ${{ inputs.replace_run_id2 != '' && inputs.deliver_from_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: out/replace2
          run-id: ${{ inputs.replace_run_id2 }}
          github-token: ${{ github.token }}

      - name: 추가 교체 장면 클립 내려받기 3
        if: ${{ inputs.replace_run_id3 != '' && inputs.deliver_from_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video
          path: out/replace3
          run-id: ${{ inputs.replace_run_id3 }}
          github-token: ${{ github.token }}

      - name: ffmpeg와 한글 폰트 설치
        if: ${{ inputs.deliver_from_run_id == '' && inputs.qc_tts != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 완성본에서 장면 복구 (소스 Artifact 만료 시)
        if: ${{ inputs.slice_source != '' && inputs.deliver_from_run_id == '' }}
        run: |
          mkdir -p out
          if [ -f "deliveries/${SKIT}-skit-final.mp4" ]; then
            cp "deliveries/${SKIT}-skit-final.mp4" "out/${SKIT}-base.mp4"
          else
            cat deliveries/${SKIT}-skit-final.mp4.part-* > "out/${SKIT}-base.mp4"
          fi
          python3 scripts/slice_scenes.py "out/${SKIT}-base.mp4" "scripts/scenes/${SKIT}.json" out

      - name: 교체 적용
        if: ${{ inputs.replace_run_id != '' && inputs.deliver_from_run_id == '' }}
        run: |
          ls out/replace/scene*.mp4
          cp -f out/replace/scene*.mp4 out/
          rm -rf out/replace

      - name: 추가 교체 적용
        if: ${{ inputs.replace_run_id2 != '' && inputs.deliver_from_run_id == '' }}
        run: |
          ls out/replace2/scene*.mp4
          cp -f out/replace2/scene*.mp4 out/
          rm -rf out/replace2

      - name: 추가 교체 적용 3
        if: ${{ inputs.replace_run_id3 != '' && inputs.deliver_from_run_id == '' }}
        run: |
          ls out/replace3/scene*.mp4
          cp -f out/replace3/scene*.mp4 out/
          rm -rf out/replace3

      - name: 자막 입히기
        if: ${{ inputs.deliver_from_run_id == '' && inputs.qc_tts != 'true' && inputs.slice_source == '' }}
        run: |
          ffmpeg -i "out/${SKIT}-skit.mp4" -vf "ass=subs/${SKIT}.ass" \
            -c:v libx264 -preset medium -crf 18 -c:a copy \
            "out/${SKIT}-skit-subbed.mp4"

      - name: 이전 실행 중간 산출물 복원 (이어하기)
        if: ${{ inputs.resume_run_id != '' && inputs.deliver_from_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video-subbed
          path: out
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - name: 무효화된 중간 산출물 삭제 (재생성 대상)
        if: ${{ inputs.invalidate != '' && inputs.deliver_from_run_id == '' }}
        run: |
          cd out/audio
          rm -fv ${{ inputs.invalidate }}

      - name: 대사 TTS 언어 검사 (QC 전용)
        if: ${{ inputs.qc_tts == 'true' }}
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_API_KEY }}
        run: |
          pip install --quiet fal-client
          EXTRA=""
          if [ -n "${{ inputs.qc_patterns }}" ]; then
            EXTRA="--patterns ${{ inputs.qc_patterns }}"
          fi
          python3 scripts/qc_tts.py --ass "subs/${SKIT}.ass" --audio-dir out/audio \
            --config "scripts/audio/${SKIT}.json" --report qc-report.txt $EXTRA

      # 로그/Artifact 접근이 막힌 환경에서도 결과를 git으로 받을 수 있게 한다
      - name: QC 보고서 커밋
        if: ${{ inputs.qc_tts == 'true' }}
        run: |
          mkdir -p docs/qc
          cp qc-report.txt "docs/qc/${SKIT}-qc-${{ github.run_id }}.txt"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/qc
          git commit -m "QC 보고서 (${SKIT}, run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: 대사 TTS와 배경음악 생성 후 믹싱 (립싱크·현장음 옵션)
        if: ${{ inputs.add_audio == 'true' && inputs.deliver_from_run_id == '' && inputs.qc_tts != 'true' }}
        env:
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ inputs.lipsync }}" = "true" ]; then
            pip install --quiet fal-client
            EXTRA="--lipsync --scenes-dir out"
          fi
          if [ -n "${{ inputs.slice_source }}" ]; then
            EXTRA="$EXTRA --no-burn --burn-scenes ${{ inputs.burn_scenes }}"
          fi
          python3 scripts/generate_audio.py \
            --ass "subs/${SKIT}.ass" \
            --config "scripts/audio/${SKIT}.json" \
            --video "out/${SKIT}-skit-subbed.mp4" \
            --out "out/${SKIT}-skit-final.mp4" \
            $EXTRA

      - name: 결과 영상 업로드
        if: ${{ always() && inputs.deliver_from_run_id == '' && inputs.qc_tts != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKIT }}-skit-video-subbed
          path: |
            out/${{ env.SKIT }}-skit-subbed.mp4
            out/${{ env.SKIT }}-skit-final.mp4
            out/audio/line*.mp3
            out/audio/lip*.mp4
            out/audio/amb*.wav
            out/audio/bgm.audio
          retention-days: 30

      # Artifact 저장소(Azure)에 접근할 수 없는 환경에서 git으로 영상을 받을 수 있게 한다
      - name: 완성 영상 브랜치에 커밋
        if: ${{ inputs.commit_output == 'true' && inputs.qc_tts != 'true' }}
        run: |
          mkdir -p deliveries
          if [ -f "out/${SKIT}-skit-final.mp4" ]; then
            SRC="out/${SKIT}-skit-final.mp4"
          else
            SRC="out/${SKIT}-skit-subbed.mp4"
          fi
          BASE="deliveries/$(basename "$SRC")"
          rm -f "$BASE" "$BASE".part-*
          # GitHub 파일 한도(100MB) 초과 시 90MB 조각으로 분할 (cat *.part-* > 원본 으로 복원)
          if [ "$(stat -c%s "$SRC")" -gt 99000000 ]; then
            split -b 90m -d "$SRC" "$BASE.part-"
          else
            cp "$SRC" deliveries/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deliveries
          git commit -m "완성 영상 추가 (${SKIT})"
          # 실행 중 브랜치에 다른 커밋이 올라온 경우에 대비
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
